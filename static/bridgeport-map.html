<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive Map of Bridgeport — Moonshroud Realms</title>
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<style>
  :root {
    --bg:#1b1a17; --panel:#242220; --ink:#ece6d8; --muted:#a79f8e; --line:#3a3731; --accent:#d9a441;
    --c-district:#d9a441; --c-gate:#c9704a; --c-harbor:#4aa3c9; --c-landmark:#b57edc; --c-trade:#8fbf5a;
    --c-guild:#e0c15a; --c-market:#e08a5a; --c-inn:#d9708f; --c-bridge:#9aa7b5; --c-temple:#f2efe4; --c-other:#8c8c8c;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--ink); font:15px/1.4 Georgia,'Times New Roman',serif; }
  #app { display:flex; height:100%; }
  #panel { width:320px; max-width:85vw; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; z-index:1000; transition:margin-left .2s; }
  #panel.closed { margin-left:-320px; }
  #panel header { padding:12px 14px 8px; border-bottom:1px solid var(--line); }
  #panel h1 { margin:0 0 2px; font-size:19px; color:var(--accent); font-weight:normal; letter-spacing:.02em; }
  #panel header a { color:var(--muted); font-size:13px; text-decoration:none; }
  #panel header a:hover { color:var(--ink); text-decoration:underline; }
  #search { width:100%; margin-top:10px; padding:8px 10px; border-radius:6px; border:1px solid var(--line); background:#161513; color:var(--ink); font:inherit; }
  #chips { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
  .chip { border:1px solid var(--line); background:transparent; color:var(--muted); padding:2px 9px 2px 7px; border-radius:99px; font:12px Georgia,serif; cursor:pointer; display:flex; align-items:center; gap:5px; }
  .chip i { width:9px; height:9px; border-radius:50%; display:inline-block; }
  .chip.off { opacity:.4; }
  .chip:hover { color:var(--ink); }
  #list { overflow-y:auto; flex:1; padding:6px 0 14px; }
  #list h2 { font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); margin:14px 14px 4px; font-weight:normal; }
  #list .note { margin:0 14px 6px; font-size:12px; color:var(--muted); font-style:italic; }
  .row { display:flex; align-items:center; gap:9px; padding:6px 14px; cursor:pointer; }
  .row:hover, .row.active { background:#2e2b27; }
  .row i { width:10px; height:10px; border-radius:50%; flex:none; border:1px solid rgba(0,0,0,.5); }
  .row span { flex:1; }
  .row small { color:var(--muted); font-size:11px; }
  #mapwrap { flex:1; position:relative; min-width:0; }
  #map { position:absolute; inset:0; background:#14233a; }
  #toggle { position:absolute; top:84px; left:10px; z-index:1100; width:36px; height:36px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font-size:18px; cursor:pointer; }
  #panel:not(.closed) ~ #mapwrap #toggle { display:none; }
  #closebtn { float:right; background:none; border:0; color:var(--muted); font-size:20px; cursor:pointer; line-height:1; }
  .leaflet-container { font:inherit; background:#14233a; }
  .pin { position:absolute; left:50%; top:50%; width:var(--pin,8px); height:var(--pin,8px); transform:translate(-50%,-50%); border-radius:50%; border:1px solid #1b1a17; box-shadow:0 0 0 1px rgba(255,255,255,.85), 0 1px 2px rgba(0,0,0,.6); box-sizing:border-box; }
  .pin.approx { box-shadow:0 0 0 2px #ff4d4d; }
  .pin.sel { transform:translate(-50%,-50%) scale(1.7); box-shadow:0 0 0 2px var(--accent), 0 0 10px var(--accent); }
  .leaflet-tooltip.lbl { background:rgba(20,18,15,.82); color:#f4ecd8; border:0; box-shadow:none; font:11.5px Georgia,serif; padding:1px 5px; border-radius:3px; white-space:nowrap; }
  .leaflet-tooltip.lbl::before { display:none; }
  .labels-off .leaflet-tooltip.lbl { display:none; }
  .labels-off .leaflet-tooltip.lbl.force { display:block; }
  .street { position:absolute; left:0; top:0; color:#fff6d8; font:italic bold 11px Georgia,serif; white-space:nowrap; text-shadow:0 0 2px #000,0 0 3px #000,0 0 5px #000; letter-spacing:.12em; text-transform:uppercase; pointer-events:none; text-align:center; }
  .edit .street { pointer-events:auto; cursor:move; }
  .street.sel { color:#ffd25a; outline:1px dashed #ffd25a; outline-offset:3px; }
  #editbar { max-height:62vh; overflow:auto; }
  #editbar h4 { margin:9px 0 0; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:normal; }
  #editbar select { padding:3px 6px; border-radius:5px; border:1px solid var(--line); background:#161513; color:var(--ink); font:inherit; }
  #editbar .row2 { margin-top:7px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  #editbar input[type=text] { padding:3px 7px; border-radius:5px; border:1px solid var(--line); background:#161513; color:var(--ink); font:inherit; width:190px; }
  #editbar input[type=range] { width:130px; vertical-align:middle; }
  .streets-off .street { display:none; }
  .popup h3 { margin:0 0 4px; font-size:17px; color:#3a2a0e; }
  .popup p { margin:0 0 8px; color:#2a2a2a; }
  .popup a.go { display:inline-block; background:#3a2a0e; color:#f6e7c1; padding:4px 10px; border-radius:5px; text-decoration:none; font-size:13px; }
  .popup .cat { font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:#7a6a4a; margin-bottom:2px; }
  .popup .link { font-size:12px; margin-top:6px; }
  .popup .link a { color:#6a5320; }
  .leaflet-popup-content-wrapper { background:#f6ecd2; border-radius:8px; }
  .leaflet-popup-tip { background:#f6ecd2; }
  #editbar { position:absolute; bottom:12px; left:50%; transform:translateX(-50%); z-index:1100; background:var(--panel); border:1px solid #ff4d4d; border-radius:8px; padding:8px 12px; font:13px Georgia,serif; max-width:92%; display:none; }
  #editbar button { margin-left:0; padding:4px 10px; border-radius:5px; border:1px solid var(--line); background:#3a3731; color:var(--ink); cursor:pointer; font:inherit; }
  #toolbar { position:absolute; top:10px; right:10px; z-index:1100; display:flex; gap:6px; }
  #toolbar button { padding:6px 10px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; font:13px Georgia,serif; }
  #toolbar button.off { opacity:.5; }
  @media (max-width:640px) { #panel { position:absolute; inset:0 auto 0 0; width:300px; } #panel.closed { margin-left:-310px; } }
</style>
</head>
<body>
<div id="app">
  <aside id="panel">
    <header>
      <button id="closebtn" title="Hide panel" aria-label="Hide panel">&times;</button>
      <h1>Bridgeport</h1>
      <a href="/world/bridgeport/">&larr; About Bridgeport</a> &nbsp;·&nbsp; <a href="/world/bridgeport-locations/">All locations</a>
      <input id="search" type="search" placeholder="Search streets and places…" autocomplete="off">
      <div id="chips"></div>
    </header>
    <div id="list"></div>
  </aside>
  <div id="mapwrap">
    <button id="toggle" title="Show panel" aria-label="Show panel">&#9776;</button>
    <div id="toolbar">
      <button id="btnLabels" title="Show or hide place names">Names</button>
      <button id="btnStreets" title="Show or hide street names">Streets</button>
    </div>
    <div id="map"></div>
    <div id="editbar"><div id="editmsg"></div><h4>Street names</h4><div class="row2"><input type="text" id="stName" placeholder="Street name" autocomplete="off"><button id="stPlace">+ Place street name</button><span id="stTools" style="display:none"> rotate <input type="range" id="stRot" min="-180" max="180" step="1"> size <input type="range" id="stSize" min="20" max="240" step="5"> <button id="stDel">Delete</button></span></div><h4>Pins</h4><div class="row2"><b id="pnMode" style="color:var(--accent);font-weight:normal">New pin</b><button id="pnNew" style="display:none">Done &mdash; start a new pin</button></div><div class="row2"><input type="text" id="pnName" placeholder="Pin name" autocomplete="off"><select id="pnCat"></select><input type="text" id="pnUrl" placeholder="Link, e.g. /world/bridgeport-locations/#id" style="width:260px"></div><div class="row2"><input type="text" id="pnBlurb" placeholder="One-line description (shown in the popup)" style="width:420px"><button id="pnPlace">+ Place new pin</button><button id="pnDel" style="display:none">Delete pin</button></div><div class="row2" style="border-top:1px solid var(--line);padding-top:7px"><button id="copyjson">Copy JSON</button><button id="dljson">Download bridgeport-map.json</button></div></div>
  </div>
</div>
<script src="/vendor/leaflet/leaflet.js"></script>
<script>
(async function () {
  const CATS = { district:'District', gate:'Gate', harbor:'Harbor', landmark:'Landmark', trade:'Trade', guild:'Guildhall',
                 market:'Market', inn:'Inn / Tavern', bridge:'Bridge', temple:'Temple', other:'Other' };
  const EDIT = new URLSearchParams(location.search).has('edit');
  const data = await (await fetch('/data/bridgeport-map.json')).json();
  const W = data.width, H = data.height;
  const ll = (x, y) => L.latLng(-y, x);                 // image pixels (origin top-left) -> map coords
  const bounds = L.latLngBounds(ll(0, H), ll(W, 0));

  const map = L.map('map', { crs: L.CRS.Simple, minZoom: -4, maxZoom: 2, zoomSnap: 0.25, zoomDelta: 0.5,
                             maxBounds: bounds.pad(0.15), maxBoundsViscosity: 0.8, attributionControl: false });
  L.imageOverlay(data.image, bounds).addTo(map);
  const fit = map.getBoundsZoom(bounds, false);
  map.setMinZoom(fit - 0.5);
  map.fitBounds(bounds);

  // ----- streets -----
  const streetLayer = L.layerGroup().addTo(map);
  const streetState = {};
  function labelHtml(s) { return '<div class="street" data-id="'+s.id+'" style="transform:translate(-50%,-50%) rotate('+(s.rot||0)+'deg)">'+s.name.replace(/</g,'&lt;')+'</div>'; }
  function addStreet(s) {
    const st = { s };
    if (s.line) st.line = L.polyline(s.line.map(p => ll(p[0], p[1])), { color:'#ffe9a8', weight:2, opacity:.5, dashArray:'2 6', lineCap:'round', interactive:false }).addTo(streetLayer);
    st.marker = L.marker(ll(s.label[0], s.label[1]), { interactive:EDIT, draggable:EDIT, icon:L.divIcon({ className:'', html:labelHtml(s), iconSize:[0,0] }) }).addTo(streetLayer);
    if (EDIT) {
      st.marker.on('click', () => selStreet(s.id));
      st.marker.on('dragend', () => { const q = st.marker.getLatLng(); s.label = [Math.round(q.lng), Math.round(-q.lat)]; selStreet(s.id); msg('Moved “'+s.name+'” to ('+s.label[0]+', '+s.label[1]+')'); });
    }
    streetState[s.id] = st;
  }
  function redrawLabel(s) { const st = streetState[s.id]; st.marker.setIcon(L.divIcon({ className:'', html:labelHtml(s), iconSize:[0,0] })); applyLabels(); markSel(); }
  data.streets.forEach(addStreet);

  // ----- markers -----
  const markers = {};
  const layer = L.layerGroup().addTo(map);
  const hidden = new Set();
  let selected = null;

  function popupHtml(l) {
    return '<div class="popup"><div class="cat">'+(l.category==='street'?'Street':(CATS[l.category]||''))+'</div><h3>'+l.name+'</h3>'+(l.blurb?'<p>'+l.blurb+'</p>':'')+(l.url?'<a class="go" href="'+l.url+'">Read more &rarr;</a>':'')+'</div>';
  }
  function pinIcon(l) {
    return L.divIcon({ className:'', iconSize:[20,20], iconAnchor:[10,10], popupAnchor:[0,-8],
      html:'<div class="pin'+(EDIT&&l.approx?' approx':'')+'" style="background:var(--c-'+l.category+')"></div>' });
  }
  function makeMarker(l) {
    const icon = pinIcon(l);
    const m = L.marker(ll(l.x, l.y), { icon, draggable: EDIT, keyboard:true, title:l.name, riseOnHover:true });
    m.bindTooltip(l.name, { permanent:true, direction:'right', offset:[10,0], className:'lbl' });
    m.bindPopup(popupHtml(l), { maxWidth:300, autoPanPadding:[40,40] });
    m.on('click', () => { select(l.id, false); if (EDIT && window.pinSelect) window.pinSelect(l.id); });
    m.on('popupclose', () => { if (selected === l.id) { setSel(null); } });
    if (EDIT) m.on('dragend', () => { const p = m.getLatLng(); l.x = Math.round(p.lng); l.y = Math.round(-p.lat); l.approx = false; m.setIcon(pinIcon(l)); setSel(selected); msg('Moved '+l.name+' to ('+l.x+', '+l.y+')'); });
    markers[l.id] = m;
    return m;
  }
  data.locations.forEach(l => { if (l.onMap) makeMarker(l).addTo(layer); });

  function setSel(id) {
    if (selected && markers[selected]) markers[selected].getElement()?.firstChild?.classList.remove('sel');
    selected = id;
    if (id && markers[id]) markers[id].getElement()?.firstChild?.classList.add('sel');
    document.querySelectorAll('.row').forEach(r => r.classList.toggle('active', (r.dataset.ids || r.dataset.id).split(',').includes(id)));
    if (id) history.replaceState(null, '', '#' + id + (EDIT ? location.search : '')); else history.replaceState(null, '', location.pathname + location.search);
  }
  function select(id, fly) {
    const l = data.locations.find(x => x.id === id) || data.streets.find(x => x.id === id);
    if (!l) return;
    if (!l) return;
    if (l.label) {                                    // street
      const st = streetState[id];
      if (l.line) map.fitBounds(st.line.getBounds().pad(0.2), { maxZoom: 0 }); else map.flyTo(ll(l.label[0], l.label[1]), Math.max(map.getZoom(), fit + 1.5), { duration:.6 });
      if (l.url) L.popup({ maxWidth:300 }).setLatLng(ll(l.label[0], l.label[1])).setContent(popupHtml(Object.assign({}, l, {category:'street'}))).openOn(map);
      setSel(id); return;
    }
    if (!l.onMap) {                                   // not on this map sheet
      map.closePopup();
      L.popup({ maxWidth:300, closeButton:true }).setLatLng(map.getCenter())
        .setContent(popupHtml(l).replace('</p>','</p><p class="link" style="color:#6a5320"><em>This place lies beyond the edge of this map sheet.</em></p>')).openOn(map);
      setSel(id); return;
    }
    if (fly) map.flyTo(ll(l.x, l.y), Math.max(map.getZoom(), fit + 1.5), { duration:.6 });
    markers[id].openPopup();
    setSel(id);
    if (EDIT && window.pinSelect) window.pinSelect(id);
  }

  // ----- panel -----
  const listEl = document.getElementById('list'), chipsEl = document.getElementById('chips'), qEl = document.getElementById('search');
  function ensureChip(c) {
    if (chipsEl.querySelector('[data-c="'+c+'"]')) return;
    const b = document.createElement('button'); b.className = 'chip'; b.dataset.c = c;
    b.innerHTML = '<i style="background:var(--c-'+c+')"></i>'+(CATS[c]||c);
    b.onclick = () => { hidden.has(c) ? hidden.delete(c) : hidden.add(c); b.classList.toggle('off', hidden.has(c)); refresh(); };
    chipsEl.appendChild(b);
  }
  [...new Set(data.locations.map(l => l.category))].forEach(ensureChip);
  const streetCycle = {};
  function row(l, kind) {
    const d = document.createElement('div'); d.className = 'row'; d.dataset.id = l.id; d.tabIndex = 0;
    d.innerHTML = '<i style="background:'+(kind==='street'?'#ffe9a8':'var(--c-'+l.category+')')+'"></i><span>'+l.name+'</span>'+(kind==='street'?'<small>street</small>':'');
    const go = () => { if (window.matchMedia('(max-width:640px)').matches) panel.classList.add('closed'); select(l.id, true); };
    d.onclick = () => { if (EDIT && !l.onMap && kind!=='street') { placing = l; msg('Click the map to place “'+l.name+'”'); return; } go(); };
    d.onkeydown = e => { if (e.key === 'Enter') go(); };
    return d;
  }
  function refresh() {
    const q = qEl.value.trim().toLowerCase();
    const ok = l => !hidden.has(l.category) && (!q || (l.name + ' ' + l.blurb).toLowerCase().includes(q));
    listEl.innerHTML = '';
    // one row per street name; a street labelled in several places cycles through them on each click
    const groups = {};
    data.streets.filter(s => !q || s.name.toLowerCase().includes(q)).forEach(s => (groups[s.name.trim().toLowerCase()] = groups[s.name.trim().toLowerCase()] || []).push(s));
    const gl = Object.values(groups).sort((a,b) => a[0].name.localeCompare(b[0].name));
    if (gl.length) {
      listEl.insertAdjacentHTML('beforeend', '<h2>Streets</h2>');
      gl.forEach(g => {
        const d = row(g[0], 'street'); const key = g[0].name.trim().toLowerCase();
        d.dataset.ids = g.map(x => x.id).join(',');
        if (g.length > 1) d.querySelector('small').textContent = g.length + ' labels';
        d.onclick = () => {
          const i = ((streetCycle[key] ?? -1) + 1) % g.length; streetCycle[key] = i;
          if (window.matchMedia('(max-width:640px)').matches) panel.classList.add('closed');
          select(g[i].id, true);
        };
        listEl.appendChild(d);
      });
    }
    const on = data.locations.filter(l => l.onMap && ok(l)).sort((a,b)=>a.name.localeCompare(b.name));
    const off = data.locations.filter(l => !l.onMap && ok(l)).sort((a,b)=>a.name.localeCompare(b.name));
    if (on.length) { listEl.insertAdjacentHTML('beforeend', '<h2>On this map</h2>'); on.forEach(l => listEl.appendChild(row(l))); }
    if (off.length) {
      listEl.insertAdjacentHTML('beforeend', '<h2>Elsewhere in Bridgeport</h2><div class="note">'+(EDIT ? 'Not placed yet — click an entry, then click the map.' : 'Beyond the edge of this map sheet; each links to its page.')+'</div>');
      off.forEach(l => listEl.appendChild(row(l)));
    }
    data.locations.forEach(l => { if (!l.onMap) return; const m = markers[l.id]; const vis = ok(l); if (vis && !layer.hasLayer(m)) layer.addLayer(m); if (!vis && layer.hasLayer(m)) layer.removeLayer(m); });
    if (selected) setSel(selected);
  }
  qEl.addEventListener('input', refresh);
  const panel = document.getElementById('panel');
  document.getElementById('closebtn').onclick = () => { panel.classList.add('closed'); setTimeout(() => map.invalidateSize(), 250); };
  document.getElementById('toggle').onclick = () => { panel.classList.remove('closed'); setTimeout(() => map.invalidateSize(), 250); };
  if (window.matchMedia('(max-width:640px)').matches) panel.classList.add('closed');

  // ----- label / street toggles & zoom behaviour -----
  const mapEl = document.getElementById('map');
  let showNames = true, showStreets = true;
  function applyLabels() {
    const z = map.getZoom() - fit;
    mapEl.classList.toggle('labels-off', !showNames || z < 0.6);
    mapEl.classList.toggle('streets-off', !showStreets);
    mapEl.classList.toggle('edit', EDIT);
    // pins are sized in map units (about one building), with a floor so they stay clickable
    mapEl.style.setProperty('--pin', Math.max(5, Math.min(16, 55 * Math.pow(2, map.getZoom()))) + 'px');
    const sc = Math.pow(2, map.getZoom());
    document.querySelectorAll('.street').forEach(e => {
      const st = streetState[e.dataset.id]; const size = (st && st.s.size) || 80;   // font height in map units
      const px = Math.min(48, size * sc);
      e.style.fontSize = Math.max(5, px) + 'px';
      e.style.display = (!EDIT && px < 6.5) ? 'none' : '';                           // too small to read: appears as you zoom in
    });
  }
  document.getElementById('btnLabels').onclick = e => { showNames = !showNames; e.target.classList.toggle('off', !showNames); applyLabels(); };
  document.getElementById('btnStreets').onclick = e => { showStreets = !showStreets; e.target.classList.toggle('off', !showStreets); applyLabels(); };
  map.on('zoomend', applyLabels); applyLabels();

  // ----- edit mode (add ?edit=1 to the address) -----
  let placing = null, placingStreet = false, curStreet = null;
  const bar = document.getElementById('editbar'), msgEl = document.getElementById('editmsg');
  const stName = document.getElementById('stName'), stRot = document.getElementById('stRot'), stSize = document.getElementById('stSize'), stTools = document.getElementById('stTools');
  function msg(t) { msgEl.textContent = t; }
  function markSel() { document.querySelectorAll('.street').forEach(e => e.classList.toggle('sel', EDIT && e.dataset.id === curStreet)); }
  function selStreet(id) {
    curStreet = id; const s = data.streets.find(x => x.id === id);
    if (id && window.pinClear) window.pinClear();
    stTools.style.display = s ? '' : 'none';
    if (s) { stName.value = s.name; stRot.value = s.rot || 0; stSize.value = s.size || 80; }
    markSel();
  }
  function slug(n) { let b = n.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'street', id = b, k = 2; while (data.streets.some(x => x.id === id)) id = b + '-' + (k++); return id; }
  if (EDIT) {
    bar.style.display = 'block'; msg('Edit mode: drag pins or street names to move them (red rings = best guesses). Nothing is saved until you download the JSON into the repo.');
    // ----- pins -----
    const pnName = document.getElementById('pnName'), pnCat = document.getElementById('pnCat'), pnUrl = document.getElementById('pnUrl'), pnBlurb = document.getElementById('pnBlurb'), pnDel = document.getElementById('pnDel');
    Object.keys(CATS).forEach(c => pnCat.insertAdjacentHTML('beforeend', '<option value="'+c+'">'+CATS[c]+'</option>'));
    let curPin = null, placingPin = false;
    function unique(b) { let id = b, k = 2; while (data.locations.some(x => x.id === id) || data.streets.some(x => x.id === id)) id = b + '-' + (k++); return id; }
    const pnMode = document.getElementById('pnMode'), pnNew = document.getElementById('pnNew');
    function setMode() {
      pnMode.textContent = curPin ? 'Editing pin: ' + curPin.name : 'New pin (fill in the fields, then click “+ Place new pin”)';
      pnDel.style.display = pnNew.style.display = curPin ? '' : 'none';
    }
    function clearPin() { curPin = null; pnName.value = ''; pnUrl.value = ''; pnBlurb.value = ''; setMode(); }
    window.pinClear = clearPin;
    window.pinSelect = id => {
      curPin = data.locations.find(x => x.id === id) || null;
      if (curPin) { pnName.value = curPin.name; pnCat.value = curPin.category; pnUrl.value = curPin.url || ''; pnBlurb.value = curPin.blurb || ''; selStreet(null); }
      setMode();
    };
    pnNew.onclick = () => { clearPin(); map.closePopup(); setSel(null); msg('Ready for a new pin.'); };
    setMode();
    function updatePin() {
      const l = curPin; if (!l || placingPin) return;
      l.name = pnName.value || l.name; l.category = pnCat.value; l.url = pnUrl.value.trim(); l.blurb = pnBlurb.value.trim();
      const m = markers[l.id]; if (m) { m.setIcon(pinIcon(l)); m.setTooltipContent(l.name); m.setPopupContent(popupHtml(l)); setSel(selected); }
      ensureChip(l.category); pnMode.textContent = 'Editing pin: ' + l.name; refresh();
    }
    [pnName, pnCat, pnUrl, pnBlurb].forEach(el => el.addEventListener('input', updatePin));
    document.getElementById('pnPlace').onclick = () => {
      if (!pnName.value.trim()) { msg('Type a pin name first (and pick a category), then click “+ Place new pin”.'); pnName.focus(); return; }
      placingPin = true; placing = null; placingStreet = false; msg('Now click the map where “'+pnName.value.trim()+'” should go.');
    };
    pnDel.onclick = () => {
      const l = curPin; if (!l || !confirm('Delete the pin “'+l.name+'”?')) return;
      const m = markers[l.id]; if (m) { layer.removeLayer(m); delete markers[l.id]; }
      data.locations.splice(data.locations.indexOf(l), 1); clearPin(); map.closePopup(); setSel(null); refresh(); msg('Deleted “'+l.name+'”.');
    };
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !e.target.matches('input,select')) { clearPin(); selStreet(null); placingPin = placingStreet = false; placing = null; map.closePopup(); } });
    document.getElementById('stPlace').onclick = () => {
      placingPin = false;
      const n = stName.value.trim(); if (!n) { msg('Type the street name first, then click “Place street name”.'); stName.focus(); return; }
      placingStreet = true; placing = null; msg('Now click the map where “'+n+'” should go.');
    };
    stName.addEventListener('input', () => { const s = data.streets.find(x => x.id === curStreet); if (s && !placingStreet) { s.name = stName.value || s.name; redrawLabel(s); refresh(); } });
    stRot.addEventListener('input', () => { const s = data.streets.find(x => x.id === curStreet); if (s) { s.rot = +stRot.value; redrawLabel(s); } });
    stSize.addEventListener('input', () => { const s = data.streets.find(x => x.id === curStreet); if (s) { s.size = +stSize.value; applyLabels(); } });
    document.getElementById('stDel').onclick = () => {
      const s = data.streets.find(x => x.id === curStreet); if (!s) return;
      if (!confirm('Delete the street “'+s.name+'”'+(s.line?' (and its dotted line)':'')+'?')) return;
      const st = streetState[s.id]; streetLayer.removeLayer(st.marker); if (st.line) streetLayer.removeLayer(st.line);
      delete streetState[s.id]; data.streets.splice(data.streets.indexOf(s), 1); selStreet(null); refresh(); msg('Deleted “'+s.name+'”.');
    };
    map.on('click', e => {
      const x = Math.round(e.latlng.lng), y = Math.round(-e.latlng.lat);
      if (placingPin) {
        placingPin = false; const n = pnName.value.trim();
        const l = { id: unique(slug(n)), name: n, blurb: pnBlurb.value.trim(), url: pnUrl.value.trim(), category: pnCat.value, x, y, approx: false, onMap: true };
        data.locations.push(l); makeMarker(l).addTo(layer); ensureChip(l.category); clearPin(); refresh(); setSel(l.id);
        msg('Placed “'+n+'”. Drag it to adjust, or click it to edit. The fields are clear for the next new pin.'); return;
      }
      if (placingStreet) {
        placingStreet = false; const n = stName.value.trim();
        const s = { id: slug(n), name: n, label: [x, y], rot: 0, size: +stSize.value || 80 }; data.streets.push(s); addStreet(s); applyLabels(); refresh(); selStreet(s.id);
        msg('Placed “'+n+'”. Drag to adjust, use the slider to rotate. Type another name to add more.'); return;
      }
      if (placing) {
        const l = placing; placing = null; l.x = x; l.y = y; l.onMap = true; l.approx = false;
        makeMarker(l).addTo(layer); refresh(); msg('Placed '+l.name+' at ('+x+', '+y+')'); return;
      }
      selStreet(null); clearPin(); msg('Clicked ('+x+', '+y+')');
    });
    document.getElementById('dljson').onclick = () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type:'application/json' }));
      a.download = 'bridgeport-map.json'; a.click();
      msg('Downloaded. Replace static/data/bridgeport-map.json in the repo with that file, then reload the page.');
    };
    document.getElementById('copyjson').onclick = async () => {
      const out = JSON.stringify(data, null, 1);
      try { await navigator.clipboard.writeText(out); msg('Copied. Paste over ALL of static/data/bridgeport-map.json and save it, then reload.'); }
      catch (e) { const w = window.open('', '_blank'); w.document.write('<pre>'+out.replace(/</g,'&lt;')+'</pre>'); }
    };
  }

  refresh();
  const start = decodeURIComponent(location.hash.slice(1));
  if (start) setTimeout(() => select(start, true), 300);
  window.addEventListener('hashchange', () => { const h = decodeURIComponent(location.hash.slice(1)); if (h && h !== selected) select(h, true); });
})();
</script>
</body>
</html>
